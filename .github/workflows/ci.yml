name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: dsh package build (full installCheck)
        run: nix build .#dsh -L
      - name: flake checks (profile model + fail-loud)
        run: nix flake check -L
