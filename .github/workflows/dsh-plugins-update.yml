name: dsh-plugins-update
# dshPlugins 定期更新(update-flake-lock 同模式:开 PR 不推 main,人审后合并)
# 手动触发:gh workflow run dsh-plugins-update.yml
on:
  schedule:
    - cron: "0 4 * * 1" # 每周一 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Run updater
        run: nix run .#dsh-plugins-update .
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "dsh: bump dshPlugins"
          title: "dshPlugins: automated update"
          branch: dsh-plugins-update
          delete-branch: true
          body: |
            Automated by `.github/workflows/dsh-plugins-update.yml`.
            Review rev/hash changes before merging.
